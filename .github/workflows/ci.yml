name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `bindings` is a pyo3 cdylib that only links through maturin's build setup
  # (see workspace Cargo.toml) — this job covers the plain-cargo default
  # member, `core`, which is where all the actual discovery/classify/risk logic lives.
  rust:
    name: cargo test/clippy/fmt (core)
    runs-on: ubuntu-latest
    # Backs the Phase 2 `db` module's integration tests (see core/src/db.rs)
    # with a real, disposable Postgres — those tests skip themselves (not
    # fail) when DATABASE_URL is unset, but CI always sets it so the
    # persistence layer is verified against a live database on every push,
    # not just SQL that looks right.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pyapicheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/pyapicheck
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

  maturin-build:
    name: maturin build (python extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install "maturin>=1.7,<2.0"

      - name: maturin build
        run: maturin build --release
