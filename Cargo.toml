[workspace]
resolver = "2"
members = ["core", "bindings"]
# `bindings` is a Python extension-module cdylib: it only links correctly
# through maturin's build setup, not a plain `cargo build`/`cargo test`. Keep
# it out of the default set so root-level `cargo test` (no -p) just works;
# build it explicitly with `-p pyapicheck-bindings` or via maturin.
default-members = ["core"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Proprietary"
